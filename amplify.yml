version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # The backend phase generates amplify_outputs.json at the repo root, where admin/src/main.jsx imports it.
        # Fail early (without printing the file) if it is missing.
        - test -f amplify_outputs.json
        - npm ci --prefix admin --cache .npm --prefer-offline
    build:
      commands:
        - npm run build --prefix admin
  artifacts:
    baseDirectory: admin/dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: no-referrer
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: no-store
  - pattern: '/assets/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
